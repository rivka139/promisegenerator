<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New Covenant Fellowship – Promise Generator</title>
</head>

<body>

  <h2>New Covenant Fellowship – Promise Generator</h2>

  <input id="nameInput" placeholder="Enter a name" />
  <br /><br />

  <button onclick="generatePromise()">Get Promise</button>
  <button onclick="shareWhatsApp()" id="waBtn" disabled>Share on WhatsApp</button>

  <pre id="result"></pre>

  <!-- ✅ LOAD promises.js FIRST -->
  <script src="promises.js"></script>

  <!-- ✅ MAIN LOGIC -->
  <script>
    const CHURCH_FOOTER = "New Covenant Fellowship – 2026 Promise";
    let currentMessage = "";

    function getRandomPromise() {
      return promises[Math.floor(Math.random() * promises.length)];
    }

    function generatePromise() {
      const name = document.getElementById("nameInput").value.trim();
      if (!name) {
        document.getElementById("result").innerText = "Please enter a name.";
        return;
      }

      const verse = getRandomPromise();
      currentMessage =
`${name}, this promise is for you:

${verse.en}
${verse.te}

— ${CHURCH_FOOTER}`;

      document.getElementById("result").innerText = currentMessage;
      document.getElementById("waBtn").disabled = false;
    }

    function shareWhatsApp() {
      if (!currentMessage) return;
      const url = "https://wa.me/?text=" + encodeURIComponent(currentMessage);
      window.open(url, "_blank");
    }
  </script>

</body>
</html>
