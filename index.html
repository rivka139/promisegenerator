<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Covenant Fellowship – Promise</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #eef2ff, #ffffff);
      font-family: "Georgia", serif;
      padding: 20px;
    }

    .card {
      background: white;
      width: 100%;
      max-width: 520px;
      padding: 40px 30px;
      text-align: center;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }

    h1 {
      font-size: 24px;
      color: #2c3e50;
      margin-bottom: 5px;
    }

    .church-name {
      font-size: 16px;
      color: #666;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    .promise {
      font-size: 18px;
      color: #333;
      min-height: 150px;
      line-height: 1.6;
      margin: 25px 0;
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .promise.show {
      opacity: 1;
      transform: translateY(0);
    }

    .english {
      margin-bottom: 15px;
      font-style: italic;
    }

    .telugu {
      font-size: 19px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 30px;
      background: #4a6cf7;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>God’s Promise for You ✝️</h1>
  <div class="church-name">New Covenant Fellowship</div>

  <input type="text" id="nameInput" placeholder="Enter your name" />

  <div class="promise" id="promise"></div>

  <button id="generateBtn" onclick="generatePromise()">
    Receive My Promise
  </button>
</div>

<script>
  const promises = [
    {
      en: "For I know the plans I have for you, declares the Lord. – Jeremiah 29:11",
      te: "నేను మీ కొరకు ఆలోచిస్తున్న యోచనలు శుభకరమైనవే అని యెహోవా సెలవిచ్చుచున్నాడు. – యిర్మియా 29:11"
    },
    {
      en: "The Lord will go before you and be with you. – Deuteronomy 31:8",
      te: "యెహోవా నీకు ముందుగా నడిచిపోవును; ఆయన నీతో కూడ ఉండును. – ద్వితీయోపదేశకాండము 31:8"
    },
    {
      en: "Those who hope in the Lord will renew their strength. – Isaiah 40:31",
      te: "యెహోవాను ఆశ్రయించువారు నూతన బలము పొందుదురు. – యెషయా 40:31"
    },
    {
      en: "The Lord is my shepherd; I lack nothing. – Psalm 23:1",
      te: "యెహోవా నా కాపరి; నాకు లోటు లేదు. – కీర్తనలు 23:1"
    },
    {
      en: "Be strong and courageous, for the Lord your God is with you. – Joshua 1:9",
      te: "నీ దేవుడైన యెహోవా నీతో ఉన్నాడు; ధైర్యంగా ఉండు. – యెహోషువ 1:9"
    }
  ];

  const saved = localStorage.getItem("promiseData");

  if (saved) {
    const data = JSON.parse(saved);
    showPromise(data.name, data.promise);
    lockForm();
  }

  function generatePromise() {
    const name = document.getElementById("nameInput").value.trim();
    if (!name) {
      alert("Please enter your name");
      return;
    }

    const chosen = promises[Math.floor(Math.random() * promises.length)];
    const data = { name, promise: chosen };

    localStorage.setItem("promiseData", JSON.stringify(data));
    showPromise(name, chosen);
    lockForm();
  }

  function showPromise(name, promise) {
    const box = document.getElementById("promise");
    box.innerHTML = `
      <strong>${name},</strong>
      <div class="english">${promise.en}</div>
      <div class="telugu">${promise.te}</div>
    `;
    box.classList.add("show");
  }

  function lockForm() {
    document.getElementById("generateBtn").disabled = true;
    document.getElementById("nameInput").disabled = true;
  }
</script>

</body>
</html>
